<!DOCTYPE html>
<html>
<head>
    <title>ローカルストレージクリア</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            color: #fff;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 2px solid #fff;
            border-radius: 10px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #ddd;
        }
        .success {
            color: #4ade80;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 カートデータをクリア</h1>
        <p>古い商品データをクリアします</p>
        <button onclick="clearCart()">カートをクリア</button>
        <button onclick="clearAll()">全データクリア</button>
        <div class="success" id="success">✅ クリア完了！ページを閉じてアプリに戻ってください。</div>
    </div>

    <script>
        function clearCart() {
            localStorage.removeItem('cart-storage');
            document.getElementById('success').style.display = 'block';
            setTimeout(() => {
                window.close();
            }, 2000);
        }

        function clearAll() {
            localStorage.clear();
            document.getElementById('success').style.display = 'block';
            setTimeout(() => {
                window.close();
            }, 2000);
        }
    </script>
</body>
</html>
